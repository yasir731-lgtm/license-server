<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hassan AutoFarm — License Server Login</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="apple-touch-icon" href="/static/logo_icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 20%, #131b2e 0%, #080c14 100%);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-200">
  <div class="w-full max-w-md bg-[#0f1626]/90 border border-slate-800 backdrop-blur-xl rounded-2xl shadow-2xl p-8 space-y-6 relative overflow-hidden">
    <div class="absolute -top-24 -right-24 w-48 h-48 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-cyan-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-24 h-24 rounded-3xl overflow-hidden border border-cyan-400/50 shadow-2xl shadow-cyan-950/80 mb-2 bg-gradient-to-br from-[#0c1220] to-[#06080d] p-1.5 relative group">
        <img src="/static/logo_icon.png" alt="Hassan AutoFarm" class="w-full h-full object-contain rounded-2xl drop-shadow-[0_4px_16px_rgba(6,182,212,0.5)] transform group-hover:scale-105 transition-transform duration-300">
      </div>
      <h1 class="text-2xl font-black text-white tracking-tight">Hassan AutoFarm</h1>
      <p class="text-xs text-slate-400 font-mono tracking-wide uppercase">Enterprise License Authorization Hub</p>
    </div>

    {% if error %}
    <div class="bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs px-4 py-3 rounded-xl flex items-center gap-2">
      <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="POST" action="/login" class="space-y-4">
      <div class="space-y-1">
        <label class="text-xs font-semibold text-slate-300">Admin Username</label>
        <div class="relative">
          <i data-lucide="user" class="w-4 h-4 absolute left-3.5 top-3.5 text-slate-500"></i>
          <input type="text" name="username" required placeholder="admin" value="admin"
            class="w-full bg-[#080c14] border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
        </div>
      </div>

      <div class="space-y-1">
        <label class="text-xs font-semibold text-slate-300">Master Password</label>
        <div class="relative">
          <i data-lucide="lock" class="w-4 h-4 absolute left-3.5 top-3.5 text-slate-500"></i>
          <input type="password" name="password" required placeholder="••••••••••••"
            class="w-full bg-[#080c14] border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
        </div>
      </div>

      <button type="submit"
        class="w-full bg-gradient-to-r from-indigo-600 to-cyan-600 hover:from-indigo-500 hover:to-cyan-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-indigo-600/30 transition flex items-center justify-center gap-2 cursor-pointer mt-2">
        <i data-lucide="log-in" class="w-4 h-4"></i>
        <span>Sign In to License Control</span>
      </button>
    </form>

    <div class="pt-4 border-t border-slate-800/80 text-center">
      <p class="text-[11px] text-slate-500">Authorized Developer Portal &copy; 2026 Hassan AutoFarm Pro</p>
    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
